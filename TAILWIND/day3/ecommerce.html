<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0">
        <div class="container mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">

            <!-- Logo -->
            <h1 class="text-3xl font-bold text-blue-600">
                ShopMart
            </h1>

            <!-- Search -->
            <div class="flex w-full md:w-1/3">
                <input
                    type="text"
                    placeholder="Search products..."
                    class="w-full border border-gray-300 px-4 py-2 rounded-l-lg focus:outline-none">

                <button class="bg-blue-600 text-white px-4 rounded-r-lg">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <!-- Category Dropdown -->
            <select class="border px-4 py-2 rounded-lg">
                <option>All Categories</option>
                <option>Electronics</option>
                <option>Fashion</option>
                <option>Sports</option>
                <option>Books</option>
            </select>

            <!-- Cart -->
            <div class="relative text-2xl cursor-pointer">
                <i class="fas fa-shopping-cart"></i>
                <span class="absolute -top-2 -right-3 bg-red-500 text-white text-xs px-2 rounded-full">
                    3
                </span>
            </div>

        </div>
    </nav>

    <!-- Products Section -->
    <section class="container mx-auto px-6 py-10">

        <h2 class="text-4xl font-bold text-center mb-10">
            Featured Products
        </h2>

        <!-- Responsive Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">

            <!-- Product Card 1 -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">

                <div class="overflow-hidden">
                    <img src="../images/ecommerce/smartphone.jpeg"
                    class="w-full h-56 object-cover hover:scale-110 transition duration-500">
                </div>

                <div class="p-5">
                    <h3 class="text-xl font-bold">Smartphone</h3>

                    <p class="text-green-600 text-lg font-semibold mt-2">
                        $499
                    </p>

                    <p class="text-yellow-500 mt-2">
                        ★★★★☆
                    </p>

                    <button class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product Card 2 -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">

                <div class="overflow-hidden">
                    <img src="../images/ecommerce/shoes.jpeg"
                    class="w-full h-56 object-cover hover:scale-110 transition duration-500">
                </div>

                <div class="p-5">
                    <h3 class="text-xl font-bold">Running Shoes</h3>

                    <p class="text-green-600 text-lg font-semibold mt-2">
                        $99
                    </p>

                    <p class="text-yellow-500 mt-2">
                        ★★★★★
                    </p>

                    <button class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product Card 3 -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">

                <div class="overflow-hidden">
                    <img src="../images/ecommerce/watch.jpeg"
                    class="w-full h-56 object-cover hover:scale-110 transition duration-500">
                </div>

                <div class="p-5">
                    <h3 class="text-xl font-bold">Smart Watch</h3>

                    <p class="text-green-600 text-lg font-semibold mt-2">
                        $199
                    </p>

                    <p class="text-yellow-500 mt-2">
                        ★★★★☆
                    </p>

                    <button class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product Card 4 -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">

                <div class="overflow-hidden">
                    <img src="../images/ecommerce/headphone.jpeg"
                    class="w-full h-56 object-cover hover:scale-110 transition duration-500">
                </div>

                <div class="p-5">
                    <h3 class="text-xl font-bold">Headphones</h3>

                    <p class="text-green-600 text-lg font-semibold mt-2">
                        $149
                    </p>

                    <p class="text-yellow-500 mt-2">
                        ★★★★★
                    </p>

                    <button class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                        Add To Cart
                    </button>
                </div>

            </div>

            <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">

                <div class="overflow-hidden">
                    <img src="../images/ecommerce/airpods.jpeg"
                    class="w-full h-56 object-cover hover:scale-110 transition duration-500">
                </div>

                <div class="p-5">
                    <h3 class="text-xl font-bold">Airpods</h3>

                    <p class="text-green-600 text-lg font-semibold mt-2">
                        $849
                    </p>

                    <p class="text-yellow-500 mt-2">
                        ★★★★★
                    </p>

                    <button class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                        Add To Cart
                    </button>
                </div>

            </div>

        </div>

    </section>

</body>
</html>
