    <script>console.log("TASK 1");
let missingNumbersArray = [1, 2, 3, 5];
let missingValue = 0;

        missingValue = missingNumbersArray[i] + 1;
    }
}

console.log(missingValue);




console.log("TASK 2");
let nonRepeatedText = "programming";

for (let i = 0; i < nonRepeatedText.length; i++) {
    let nonRepeatedCount = 0;

    for (let j = 0; j < nonRepeatedText.length; j++) {
        if (nonRepeatedText[i] === nonRepeatedText[j]) {
            nonRepeatedCount++;
        }
    }

    if (nonRepeatedCount === 1) {
        console.log(nonRepeatedText[i]);
        break;
    }
}

let zeroIndex = 0;

    if (zeroMoveArray[i] !== 0) {
        zeroMoveResult[zeroIndex] = zeroMoveArray[i];

}

    if (zeroMoveArray[i] === 0) {
        zeroMoveResult[zeroIndex] = 0;

    }
}

console.log("TASK 6");
let frequentNumberArray = [1, 2, 2, 3, 2, 4, 1];

let frequentCountObject = {};
let highestCount = 0;
let mostFrequentNumber;

for (let i = 0; i < frequentNumberArray.length; i++) {
    if (frequentCountObject[frequentNumberArray[i]]) {
        frequentCountObject[frequentNumberArray[i]]++;
    } else {
        frequentCountObject[frequentNumberArray[i]] = 1;
    }

    if (frequentCountObject[frequentNumberArray[i]] > highestCount) {
        highestCount = frequentCountObject[frequentNumberArray[i]];
        mostFrequentNumber = frequentNumberArray[i];
    }
}

console.log(mostFrequentNumber);

let oddNumbersArray = [];

let oddIndex = 0;

        evenNumbersArray[evenIndex] = evenOddArray[i];

    } else {
        oddNumbersArray[oddIndex] = evenOddArray[i];
        oddIndex++;
    }
}
