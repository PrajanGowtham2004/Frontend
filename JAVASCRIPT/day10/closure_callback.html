console.log("TASK 10");
let banking = () => {
    let balance = 5000;

    return {
        depositFun: (amount) => {
            balance += amount;
        },

        withdrawFun: (amount) => {
            balance -= amount;
        },

        balanceFun: () => {
            console.log("Balance:", balance);
        }
    };
};

let account = banking();

account.depositFun(1000);
account.withdrawFun(500);
account.balanceFun();
