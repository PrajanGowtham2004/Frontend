<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Example</title>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>S.no</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tbody">
           
            
            
        </tbody>
    </table>
    


    <script>
        const takedata = async () => {
            let store = await fetch("https://dummyjson.com/users");

            let convert = await store.json();

            let showdata = document.getElementById("tbody");

            convert.users.forEach((user, index) => {
                showdata.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${user.firstName}</td>
                        <td>${user.lastName}</td>
                        <td>${user.email}</td>
                    </tr>
                `; 
            });


        };
        takedata();
    </script>
</body>
</html>
