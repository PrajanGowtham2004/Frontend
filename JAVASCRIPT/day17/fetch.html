<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <h1 class="text-3xl text-blue-700 font-bold text-center my-6">
        User Cards
    </h1>

    <div id="cards" class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-4">
    </div>

    <script>
        const takedata = async () => {
            let store = await fetch("https://dummyjson.com/users");
            let convert = await store.json();

            let showdata = document.getElementById("cards");

            convert.users.forEach((user, index) => {
                showdata.innerHTML += `
                    <div class="bg-white rounded-xl shadow-lg p-5 text-center hover:scale-105 transition duration-300">
                        
                        <img 
                            src="${user.image}" 
                            alt="${user.firstName}"
                            class="w-24 h-24 rounded-full mx-auto border-4 border-blue-500"
                        >

                        <h2 class="text-xl font-bold mt-3">
                            ${user.firstName} ${user.lastName}
                        </h2>

                        <p class="text-gray-500">
                            User ID: ${index + 1}
                        </p>

                        <p class="text-sm text-gray-700 mt-2">
                            ${user.email}
                        </p>

                        <p class="text-sm text-gray-700">
                            ${user.phone}
                        </p>

                    </div>
                `;
            });
        };

        takedata();
    </script>

</body>
</html>
