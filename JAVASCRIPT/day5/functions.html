<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNCTIONS</title>

    <script>
        console.log("TASK 1");

        function greet() {
            console.log("Welcome To JavaScript");
        }

        greet();

        console.log("TASK 2");

        let name = "Prajan Gowtham";

        function showName() {
            console.log(name);
        }

        showName();

        console.log("TASK 3");

        function addNumbers() {
            let result = 10 + 20;
            console.log(result);
        }

        addNumbers();

        console.log("TASK 4");

        function square() {
            let num = 5;
            let result = num * num;
            console.log(result);
        }

        square();

        console.log("TASK 5");

        function studentInfo() {
            console.log("Name: Prajan Gowtham");
            console.log("Course: Full Stack");
            console.log("City: Chennai");
        }

        studentInfo();

        console.log("TASK 6");

        let fruits = ["Apple", "Banana", "Mango", "Orange", "Grapes"];

        console.log(fruits);

        console.log("TASK 7");

        let students = ["Prajan", "Gokul", "Kavin", "Vijay", "Rahul"];

        console.log("First Student:", students[0]);

        console.log("TASK 8");

        let numbers = [10, 20, 30, 40, 50];

        console.log("Last Value:", numbers[numbers.length - 1]);

        console.log("TASK 9");

        let skills = [];

        skills[0] = "HTML";
        skills[1] = "CSS";
        skills[2] = "JavaScript";

        console.log(skills);

        console.log("TASK 10");

        let colors = ["Red", "Blue", "Green", "Yellow", "Black"];

        for (let i = 0; i < colors.length; i++) {
            console.log(colors[i]);
        }

        console.log("TASK 11");

        let student = {
            name: "Prajan",
            age: 21,
            course: "Full Stack"
        };

        console.log(student);

        console.log("TASK 12");

        let employee = {
            employeeName: "Arun Kumar",

            department: "IT"
        };

        console.log(employee.employeeName);

        console.log("TASK 13");

        let mobile = {
            brand: "Samsung",
            model: "Galaxy S25",
            price: 85000
        };

        console.log(mobile["price"]);

        console.log("TASK 14");

        let car = {
            brand: "Toyota",
            model: "Innova Crysta",
            color: "Black"
        };

        console.log("Brand:", car.brand);
        console.log("Model:", car.model);

        console.log("TASK 15");

        let college = {
            collegeName: "SRM University",
            location: "Chennai",
            students: 50000
        };

        console.log("College Name:", college.collegeName);
        console.log("Location:", college.location);
        console.log("Students:", college.students);
    </script>
</head>
