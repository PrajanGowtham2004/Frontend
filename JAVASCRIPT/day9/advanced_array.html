<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Advanced Array</title>
    <script>
     console.log("TASK 1");
let course = ["HTML","CSS","JavaScript"];
course.push("React", "Node.js");
console.log(course);



console.log("TASK 2");
let courses= ["HTML","CSS","JavaScript","React"];
let removedL = courses.pop();
console.log("Removed Element:",removedL);
console.log("Updated Array:", courses);



console.log("TASK 3");
let fruit = ["Apple","Mango","Orange","Banana"];
let removedF = fruit.shift();
console.log("Removed Element:",removedF);
console.log("Updated Array:", fruit);



console.log("TASK 4");
let hero = ["Ajith","Suriya","SK"];
hero.unshift("Vijay", "Dhanush");
console.log("Final Array:",hero);




console.log("TASK 5");
let coursesSp = ["HTML","CSS","Bootstrap","React"];
coursesSp.splice(2,1,"JavaScript");
console.log("Final Array:",coursesSp);



console.log("TASK 6");
let courseSl = ["HTML","CSS","JavaScript","React","Node"];
let sliced = courseSl.slice(2,4);
console.log("Sliced element:",sliced);


console.log("TASK 7");
let student = {

   name:"Prajan",

   course:"MERN",

   city:"Chennai",

   age:21

};
for(let students in student){
    console.log(students," : ",student[students]);
    
}
