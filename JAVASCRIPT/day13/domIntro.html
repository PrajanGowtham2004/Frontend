<!DOCTYPE html>
<html>
<head>
    <title>DOM Tasks with Tailwind</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center ">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">

        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
            DOM Manipulation Tasks
        </h1>

        <!-- Task 1 -->
        <div class="mb-6">
            <h1 id="title" class="text-xl font-semibold mb-2">
                Welcome
            </h1>
            <button
                onclick="changeHeading()"
                class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
            >
                Change Heading
            </button>
        </div>

        <!-- Task 2 -->
        <div class="mb-6">
            <p class="course text-lg mb-2">
                React
            </p>
            <button
                onclick="changeCourse()"
                class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
            >
                Change Course
            </button>
        </div>

        <!-- Task 3 -->
        <div class="mb-6">
            <input
                id="username"
                type="text"
                placeholder="Enter username"
                class="border p-2 rounded w-full mb-2"
            >

            <button
                onclick="changeInput()"
                class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600"
            >
                Set Username
            </button>
        </div>

        <!-- Task 4 -->
        <div class="mb-6">
            <img
                id="hero"
                src="../assets/images/domIntro/domIntro1.jpeg"
                width="200"
                class="rounded border mb-2"
            >

            <button
                onclick="changeImage()"
                class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600"
            >
                Change Image
            </button>
        </div>

        <!-- Task 5 -->
        <div>
            <a
                id="website"
                href="#"
                class="text-blue-500 underline block mb-2"
            >
                Visit
            </a>

            <button
                onclick="changeLink()"
                class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
            >
                Change Link
            </button>
        </div>

    </div>

    <script>
        function changeHeading() {
            document.getElementById("title").innerText =
                "Welcome to JavaScript DOM";
        }

        function changeCourse() {
            document.querySelector(".course").innerText =
                "MERN Stack";
        }

        function changeInput() {
            document.getElementById("username").value =
                "Prajan";
        }

        function changeImage() {
            document.querySelector("#hero").src =
                "../assets/images/domIntro/domIntro2.jpeg";
        }

        function changeLink() {
            document.getElementById("website").href =
                "https://google.com";
        }
    </script>

</body>
</html>
