<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Counter</title>
</head>
<body>

    <script>
        const products = [
            { id: 1, name: "Laptop", stock: 5 },
            { id: 2, name: "Mobile", stock: 0 },
            { id: 3, name: "Watch", stock: 8 },
            { id: 4, name: "Keyboard", stock: 0 }
        ];

        let totalProducts = products.length;

        let availableProducts = products.reduce((acc, curr) => {
            return curr.stock > 0 ? acc + 1 : acc
        }, 0);

        let outOfStock = products.reduce((acc, curr) => {
            return curr.stock === 0 ? acc + 1 : acc
        }, 0);


        console.log("Total Products:", totalProducts)
        console.log("Available Products:", availableProducts)
        console.log("Out Of Stock:", outOfStock)
    </script>
    
</body>
</html>
