<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selectors CSS</title>

    <link rel="stylesheet" href="../assets/css/ext2.css">
</head>

<body>


    <div id="main-box">
        <h1>Welcome to CSS Selectors</h1>
    </div>

    <div class="content-box">
        <h2>HTML and CSS Learning</h2>
    </div>

    <div class="context">
        <p>This paragraph uses class selector styling.</p>
    </div>

    <div>
        <h2>Element Selector Example</h2>
    </div>

    <div>
        <p>Paragraph styled using element selector.</p>
    </div>

    <div class="parent">
        <h3>Direct Child Selector</h3>

        <p>
            This paragraph is direct child of div.
        </p>

        <section>
            <p>
                This paragraph is inside section so child selector will not apply.
            </p>
        </section>
    </div>

 

</body>
</html>
