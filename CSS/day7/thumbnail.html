<!DOCTYPE html>
<html>
  <head>
    <title>Grid Design</title>
    <link rel="stylesheet" href="../assets/css/thumbnail.css" />
  </head>
  <body>
      
      <header>
        <div class="parent">
          <div>
            <h3>Thumbnail</h3>
          </div>
          
          <div class="child">
            
            <div>
              <img src="../assets/images/sla_nav/thumbnail.jpeg" alt="" width="200"/>
            </div>
            
            <div>
              <p><strong>Note:</strong> This image tile will be used to represent this course across all your academy's landing pages.
              </p>
              
              <p>
                Allowed formats:".jpg,.png,.jpeg,.gif,.webp,.sketch"
              </p>
              
              <p>Preferred minimum resolution: 480*270
              </p>
              
              <p>
                Maximum size: 150kb
              </p>
              
              <button>Change Image</button>
              <button>Remove Image</button>
              
            </div>
            
          </div>
          
        </div>
        
      </header>
  </body>
</html>
