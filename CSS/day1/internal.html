<!DOCTYPE html>
<html>

<head>

    <title>Internal CSS Example</title>

    <style>

        h1{

            color:red;

            background-color:yellow;

            text-align:center;

        }

        p{

            color:blue;

            background-color:lightgray;

            text-align:left;

        }

        div{

            color:white;

            background-color:black;

            text-align:left;

        }

        h2{

            color:green;

            background-color:pink;

            text-align:center;

        }

        span{

            color:brown;

            background-color:orange;

            text-align:left;

        }

    </style>

</head>

<body>

    <h1>Hello!</h1>

    <p>This</p>

    <div>Is</div>

    <h2>Internal</h2>

    <span>CSS</span>

</body>

</html>
